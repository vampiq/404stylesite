# Запуск: cp .env.example .env  →  задать JWT_*_SECRET  →  docker compose up --build
# Демо-данные:  docker compose run --rm -e SEED_FORCE=true app npm run seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: style
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-style}
      POSTGRES_DB: style
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U style -d style']
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args: { DB_PROVIDER: postgresql }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ['4000:4000']
    environment:
      DATABASE_URL: postgresql://style:${POSTGRES_PASSWORD:-style}@db:5432/style?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задайте JWT_ACCESS_SECRET в .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET в .env}
      SITE_URL: ${SITE_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  pgdata:
